<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f8fafc"/>
  <style>
    text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.label{font-size:18px}.small{font-size:16px}.actor{stroke:#172033;stroke-width:3;fill:none}.boundary{stroke:#315c9b;stroke-width:3;fill:#fff}.use{stroke:#315c9b;stroke-width:2;fill:#eef4ff}.link{stroke:#667085;stroke-width:2}
  </style>
  <text x="700" y="45" text-anchor="middle" class="title">Student Task Management System — Use-Case Diagram</text>
  <rect x="330" y="80" width="820" height="770" rx="16" class="boundary"/>
  <text x="740" y="115" text-anchor="middle" class="label">System Boundary</text>

  <g transform="translate(130 180)"><circle cx="0" cy="0" r="28" class="actor"/><line x1="0" y1="28" x2="0" y2="110" class="actor"/><line x1="-45" y1="62" x2="45" y2="62" class="actor"/><line x1="0" y1="110" x2="-38" y2="165" class="actor"/><line x1="0" y1="110" x2="38" y2="165" class="actor"/><text x="0" y="198" text-anchor="middle" class="label">Lecturer</text></g>
  <g transform="translate(130 560)"><circle cx="0" cy="0" r="28" class="actor"/><line x1="0" y1="28" x2="0" y2="110" class="actor"/><line x1="-45" y1="62" x2="45" y2="62" class="actor"/><line x1="0" y1="110" x2="-38" y2="165" class="actor"/><line x1="0" y1="110" x2="38" y2="165" class="actor"/><text x="0" y="198" text-anchor="middle" class="label">Student</text></g>
  <g transform="translate(1270 360)"><circle cx="0" cy="0" r="28" class="actor"/><line x1="0" y1="28" x2="0" y2="110" class="actor"/><line x1="-45" y1="62" x2="45" y2="62" class="actor"/><line x1="0" y1="110" x2="-38" y2="165" class="actor"/><line x1="0" y1="110" x2="38" y2="165" class="actor"/><text x="0" y="198" text-anchor="middle" class="label">Administrator</text></g>

  <ellipse cx="570" cy="190" rx="155" ry="52" class="use"/><text x="570" y="196" text-anchor="middle" class="label">UC-01 Publish assignment</text>
  <ellipse cx="570" cy="330" rx="155" ry="52" class="use"/><text x="570" y="336" text-anchor="middle" class="label">UC-04 Grade submission</text>
  <ellipse cx="570" cy="470" rx="155" ry="52" class="use"/><text x="570" y="476" text-anchor="middle" class="label">UC-02 View assigned tasks</text>
  <ellipse cx="570" cy="610" rx="155" ry="52" class="use"/><text x="570" y="616" text-anchor="middle" class="label">UC-03 Submit assignment</text>
  <ellipse cx="570" cy="750" rx="155" ry="52" class="use"/><text x="570" y="756" text-anchor="middle" class="label">UC-05 Track status</text>
  <ellipse cx="920" cy="250" rx="170" ry="52" class="use"/><text x="920" y="256" text-anchor="middle" class="label">UC-08 View course report</text>
  <ellipse cx="920" cy="465" rx="170" ry="52" class="use"/><text x="920" y="458" text-anchor="middle" class="small">UC-06 Manage users</text><text x="920" y="480" text-anchor="middle" class="small">and courses</text>
  <ellipse cx="920" cy="680" rx="170" ry="52" class="use"/><text x="920" y="686" text-anchor="middle" class="label">UC-07 Deadline reminder</text>

  <line x1="180" y1="230" x2="415" y2="190" class="link"/><line x1="180" y1="255" x2="415" y2="330" class="link"/><line x1="180" y1="270" x2="750" y2="250" class="link"/>
  <line x1="180" y1="610" x2="415" y2="470" class="link"/><line x1="180" y1="630" x2="415" y2="610" class="link"/><line x1="180" y1="650" x2="415" y2="750" class="link"/><line x1="180" y1="620" x2="750" y2="680" class="link"/>
  <line x1="1220" y1="405" x2="1090" y2="465" class="link"/><line x1="1220" y1="390" x2="1090" y2="250" class="link"/>
</svg>

